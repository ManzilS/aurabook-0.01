name: FullBook checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [Client, Backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './${{ matrix.component }}[dev]'
      - run: python -m pytest -q
        working-directory: ${{ matrix.component }}
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CloudflareBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run dev -- --host 127.0.0.1 --port 5174 > dev-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail http://127.0.0.1:5174/ && break || sleep 1; done
          npm run test:smoke
