services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurabook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: aurabook
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurabook"]
      interval: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      args:
        DB_EXTRAS: postgres
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      AURABOOK_CLOUD_DB_BACKEND: postgres
      AURABOOK_CLOUD_DATABASE_URL: postgresql://aurabook:${POSTGRES_PASSWORD:-changeme}@db:5432/aurabook
      AURABOOK_CLOUD_API_HOST: 0.0.0.0
      AURABOOK_CLOUD_API_PORT: "8000"
      AURABOOK_CLOUD_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-}
      AURABOOK_CLOUD_EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      AURABOOK_CLOUD_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AURABOOK_CLOUD_API_SHARED_SECRET: ${API_SHARED_SECRET:-}
    ports:
      - "8000:8000"

volumes:
  pgdata:
