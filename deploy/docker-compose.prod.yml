services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  frontend:
    build:
      context: ../Frontend
      dockerfile: ../deploy/Dockerfile.frontend
    restart: unless-stopped

  backend:
    build:
      context: ../Backend
      args:
        DB_EXTRAS: postgres
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      AURABOOK_CLOUD_DB_BACKEND: postgres
      AURABOOK_CLOUD_DATABASE_URL: postgresql://aurabook:${POSTGRES_PASSWORD}@db:5432/aurabook
      AURABOOK_CLOUD_API_HOST: 0.0.0.0
      AURABOOK_CLOUD_API_PORT: "8000"
      AURABOOK_CLOUD_REQUIRE_API_KEY: "true"
      AURABOOK_CLOUD_CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      AURABOOK_CLOUD_EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      AURABOOK_CLOUD_OPENAI_API_KEY: ${OPENAI_API_KEY}
      AURABOOK_CLOUD_API_SHARED_SECRET: ${API_SHARED_SECRET}
      AURABOOK_CLOUD_SESSION_SECRET: ${SESSION_SECRET}
      AURABOOK_CLOUD_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      AURABOOK_CLOUD_GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      AURABOOK_CLOUD_GITHUB_REDIRECT_URI: https://${DOMAIN}/auth/github/callback
      AURABOOK_CLOUD_FRONTEND_URL: https://${DOMAIN}
      AURABOOK_CLOUD_STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      AURABOOK_CLOUD_STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      AURABOOK_CLOUD_STRIPE_PRICE_PLAN_MAP: ${STRIPE_PRICE_PLAN_MAP:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/health'); assert r.status_code==200"]
      interval: 30s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ../Backend
      args:
        DB_EXTRAS: postgres
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["aurabook-cloud-janitor"]
    environment:
      AURABOOK_CLOUD_DB_BACKEND: postgres
      AURABOOK_CLOUD_DATABASE_URL: postgresql://aurabook:${POSTGRES_PASSWORD}@db:5432/aurabook
      AURABOOK_CLOUD_EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      AURABOOK_CLOUD_OPENAI_API_KEY: ${OPENAI_API_KEY}

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurabook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aurabook
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurabook"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
  caddy_data:
  caddy_config:
